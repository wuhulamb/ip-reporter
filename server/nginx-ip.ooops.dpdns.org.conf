# nginx site for the dedicated IP reporter subdomain.
#
# Install:
#   sudo cp server/nginx-ip.ooops.dpdns.org.conf \
#       /etc/nginx/sites-available/ip.ooops.dpdns.org
#   sudo ln -s /etc/nginx/sites-available/ip.ooops.dpdns.org \
#       /etc/nginx/sites-enabled/ip.ooops.dpdns.org
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate is expected at:
#   /etc/letsencrypt/live/ip.ooops.dpdns.org/{fullchain.pem,privkey.pem}
# Obtain it after the DNS A record exists:
#   sudo certbot certonly --webroot -w /var/www/html -d ip.ooops.dpdns.org

server {
    listen 80;
    listen [::]:80;
    server_name ip.ooops.dpdns.org;

    # Keep ACME HTTP-01 challenges working for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ip.ooops.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/ip.ooops.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip.ooops.dpdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
